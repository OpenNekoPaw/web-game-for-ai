<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>斗地主</title>
  <link rel="stylesheet" href="/cards.css?v=2" />
  <link rel="stylesheet" href="/styles.css?v=5" />
  <link rel="stylesheet" href="/header.css?v=4" />
  <link rel="stylesheet" href="/lifecycle.css?v=20" />
  <link rel="stylesheet" href="/cards-adapter.css?v=10" />
</head>
<body>
  <main class="game-page">
    <header class="game-header">
      <div class="game-brand">
        <h1>斗地主</h1>
        <button id="agent-connect" class="agent-connect-toggle" type="button" aria-haspopup="menu" aria-controls="agent-type-menu" aria-expanded="false">Agent 接入</button>
        <span id="score-info" class="score-info" aria-label="比赛比分" hidden></span>
      </div>
      <div class="game-info">
        <button id="invite-game" type="button" aria-haspopup="menu" aria-controls="invite-menu" aria-expanded="false">邀请</button>
        <button id="session-code-header" type="button" hidden>重连码</button>
        <button id="global-view" class="view-toggle" type="button" aria-pressed="false">全局牌面</button>
        <nav class="perspectives" aria-label="切换视角"><button data-seat="0" type="button">A</button><button data-seat="1" type="button">B</button><button data-seat="2" type="button">C</button></nav>
        <div id="replay-controls" class="replay-controls" aria-label="回放控制" hidden>
          <button id="replay-prev" type="button" aria-label="上一步" title="上一步">‹</button>
          <button id="replay-toggle" class="primary" type="button">播放</button>
          <button id="replay-next" type="button" aria-label="下一步" title="下一步">›</button>
          <input id="replay-progress" type="range" min="0" value="0" aria-label="回放进度" />
          <span id="replay-position">1 / 1</span>
          <span id="replay-event"></span>
        </div>
        <button id="rematch-game" type="button" hidden>同牌复战</button>
        <button id="strategy-record" type="button" hidden>玩家策略</button>
        <button id="decision-record" type="button" hidden>决策记录</button>
        <button id="review-record" type="button" hidden>复盘总结</button>
        <span id="competition-info" class="competition-info" hidden></span>
        <button id="game-record" type="button">对局记录</button>
        <button id="new-game" hidden>退出回放</button>
      </div>
      <div id="agent-type-menu" class="agent-type-menu" role="menu" aria-label="选择 Agent 类型" hidden>
        <button type="button" role="menuitem" data-agent-type="codex"><strong>Codex</strong><small>插件包含 Skill 与 MCP</small></button>
        <button type="button" role="menuitem" data-agent-type="mcp"><strong>通用 MCP</strong><small>适用于支持 MCP 的客户端</small></button>
      </div>
      <div id="invite-menu" class="invite-menu" role="menu" aria-label="邀请加入对局" hidden>
        <strong>邀请玩家</strong>
        <button class="invite-auto" type="button" data-invite-type="player" data-invite-seat="auto"><strong>复制玩家邀请链接</strong><small>加入时自动分配空座</small></button>
        <strong>邀请 Agent</strong>
        <div class="invite-seats"><button type="button" data-invite-type="agent" data-invite-seat="0">A</button><button type="button" data-invite-type="agent" data-invite-seat="1">B</button><button type="button" data-invite-type="agent" data-invite-seat="2">C</button></div>
        <button class="invite-spectator" type="button" data-invite-type="spectator" data-invite-seat="0">复制观战链接</button>
        <small>玩家邀请为单人单次，以实际加入顺序占座，30 分钟内有效；观战链接可重复打开</small>
      </div>
    </header>
    <section id="game-table" class="table">
      <div class="seat opponent seat-left" id="left-seat"><div class="player"><span class="avatar" id="left-avatar">B</span><span><strong id="left-name">玩家 B</strong><small id="left-count">17 张</small><small id="left-countdown" class="seat-timer" hidden></small></span></div><div id="left-cards" class="opponent-cards opponent-back-stack left"></div><div id="left-play" class="played-slot"></div></div>
      <div class="seat opponent seat-right" id="right-seat"><div class="player"><span class="avatar" id="right-avatar">C</span><span><strong id="right-name">玩家 C</strong><small id="right-count">17 张</small><small id="right-countdown" class="seat-timer" hidden></small></span></div><div id="right-cards" class="opponent-cards opponent-back-stack right"></div><div id="right-play" class="played-slot"></div></div>
      <div class="seat seat-self" id="self-seat"><div class="player"><span class="avatar" id="self-avatar">A</span><span><strong id="self-name">你的手牌</strong><small id="self-count">17 张</small><small id="self-countdown" class="seat-timer" hidden></small></span></div><div id="self-play" class="played-slot"></div><footer class="actions"><button id="bid" class="primary">叫地主</button><button id="decline" class="secondary">不叫</button><button id="pass" class="secondary">不要</button><button id="play" class="primary">出牌</button></footer><div id="my-hand" class="hand"></div></div>
      <div class="middle"><div id="game-lifecycle" class="game-lifecycle" hidden><strong id="game-status"></strong><small id="ready-status"></small><div id="player-join" class="player-join" hidden><button id="join-game" type="button">加入对局</button></div><div id="reconnect-tools" class="reconnect-tools" hidden><input id="reconnect-code" type="text" maxlength="9" autocomplete="one-time-code" placeholder="输入 8 位重连码" aria-label="重连码"><button id="reconnect-game" type="button">恢复座位</button></div><div id="session-info" class="session-info" hidden><span>重连码 <b id="session-reconnect-code"></b></span><button id="copy-reconnect-code" type="button">复制</button></div><div id="owner-seat-controls" class="owner-seat-controls" hidden></div><div id="match-setup" class="match-setup"><div class="setup-row"><span>比赛局数</span><div class="round-options" role="group" aria-label="比赛局数"><button type="button" data-rounds="1">1局</button><button type="button" data-rounds="3">3局</button><button type="button" data-rounds="5">5局</button><button type="button" data-rounds="7">7局</button></div></div><div class="setup-row"><span>房间类型</span><div class="access-options" role="group" aria-label="房间类型"><button type="button" data-access-mode="open">公开房间</button><button type="button" data-access-mode="invite_only">私人房间</button></div></div></div><button id="confirm-setup" class="primary" type="button" hidden>确认配置</button><button id="start-game" class="primary" type="button"></button></div><div class="bottom"><span>底牌</span><div id="bottom-cards" class="bottom-cards"></div></div></div>
      <aside id="strategy-panel" class="decision-panel strategy-panel" aria-label="本局玩家策略" hidden>
        <header><strong>玩家策略</strong><button id="close-strategies" type="button" aria-label="关闭玩家策略">×</button></header>
        <nav class="strategy-tabs" aria-label="切换玩家策略">
          <button type="button" data-strategy-seat="0">A</button>
          <button type="button" data-strategy-seat="1">B</button>
          <button type="button" data-strategy-seat="2">C</button>
        </nav>
        <div id="strategy-content" class="decision-list strategy-content"></div>
      </aside>
      <aside id="decision-panel" class="decision-panel" aria-label="Agent 决策记录" hidden>
        <header><strong>决策记录</strong><button id="close-decisions" type="button" aria-label="关闭决策记录">×</button></header>
        <div id="decision-list" class="decision-list"></div>
      </aside>
      <aside id="review-panel" class="decision-panel" aria-label="Agent 复盘总结" hidden>
        <header><strong>复盘总结</strong><button id="close-reviews" type="button" aria-label="关闭复盘总结">×</button></header>
        <div id="review-list" class="decision-list"></div>
      </aside>
      <aside id="history-panel" class="decision-panel" aria-label="历史对局" hidden>
        <header><strong>历史对局</strong><button id="close-history" type="button" aria-label="关闭历史对局">×</button></header>
        <div id="history-list" class="decision-list"></div>
      </aside>
      <aside id="agent-panel" class="decision-panel agent-panel" aria-label="Agent 接入" hidden>
        <header><strong id="agent-panel-title">Agent 接入</strong><button id="close-agent-panel" type="button" aria-label="关闭 Agent 接入">×</button></header>
        <div id="agent-connect-content" class="decision-list agent-connect-content"></div>
      </aside>
      <div id="message" class="message" role="status"></div>
    </section>
  </main>
  <script type="module" src="/app.js?v=50"></script>
</body>
</html>
