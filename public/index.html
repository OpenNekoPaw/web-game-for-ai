<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>斗地主</title>
  <link rel="stylesheet" href="/public/cards.css" />
  <link rel="stylesheet" href="/public/styles.css" />
  <link rel="stylesheet" href="/public/cards-adapter.css?v=4" />
</head>
<body>
  <main class="game-page">
    <header class="game-header">
      <h1>斗地主</h1>
      <div class="game-info">
        <span id="phase">准备开始</span><span id="turn">正在连接…</span>
        <button id="global-view" class="view-toggle" type="button" aria-pressed="false">全局牌面</button>
        <nav class="perspectives" aria-label="切换视角"><button data-seat="0" type="button">A</button><button data-seat="1" type="button">B</button><button data-seat="2" type="button">C</button></nav>
        <button id="new-game">新局</button>
      </div>
    </header>
    <section class="table">
      <div class="seat opponent seat-left" id="left-seat"><div class="player"><span class="avatar" id="left-avatar">B</span><span><strong id="left-name">玩家 B</strong><small id="left-count">17 张</small></span></div><div id="left-cards" class="opponent-cards cards-back vertical"></div><div id="left-play" class="played-slot"></div></div>
      <div class="seat opponent seat-right" id="right-seat"><div class="player"><span class="avatar" id="right-avatar">C</span><span><strong id="right-name">玩家 C</strong><small id="right-count">17 张</small></span></div><div id="right-cards" class="opponent-cards cards-back vertical"></div><div id="right-play" class="played-slot"></div></div>
      <div class="seat seat-self"><div class="player"><span class="avatar human" id="self-avatar">A</span><span><strong id="self-name">你的手牌</strong><small id="self-count">17 张</small></span></div><div id="self-play" class="played-slot"></div><footer class="actions"><button id="bid" class="primary">叫地主</button><button id="decline" class="secondary">不叫</button><button id="pass" class="secondary">不要</button><button id="play" class="primary">出牌</button></footer><div id="my-hand" class="hand"></div></div>
      <div class="middle"><div id="countdown" class="countdown turn-timer" aria-live="polite"></div><div class="bottom"><span>底牌</span><div id="bottom-cards" class="bottom-cards"></div></div></div>
      <div id="message" class="message" role="status"></div>
    </section>
  </main>
  <script type="module" src="/public/app.js?v=7"></script>
</body>
</html>
