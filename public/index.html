<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>斗地主</title>
  <link rel="stylesheet" href="/public/cards.css" />
  <link rel="stylesheet" href="/public/styles.css" />
  <link rel="stylesheet" href="/public/lifecycle.css?v=4" />
  <link rel="stylesheet" href="/public/cards-adapter.css?v=4" />
</head>
<body>
  <main class="game-page">
    <header class="game-header">
      <h1>斗地主</h1>
      <div class="game-info">
        <button id="global-view" class="view-toggle" type="button" aria-pressed="false">全局牌面</button>
        <nav class="perspectives" aria-label="切换视角"><button data-seat="0" type="button">A</button><button data-seat="1" type="button">B</button><button data-seat="2" type="button">C</button></nav>
        <button id="decision-record" type="button" hidden>决策记录</button>
        <button id="review-record" type="button" hidden>复盘总结</button>
        <span id="competition-info" class="competition-info" hidden></span>
        <button id="game-record" type="button">对局记录</button>
        <button id="new-game" hidden>退出回放</button>
      </div>
    </header>
    <section id="game-table" class="table">
      <div id="replay-controls" class="replay-controls" hidden>
        <button id="replay-prev" type="button">上一步</button>
        <button id="replay-toggle" class="primary" type="button">播放</button>
        <button id="replay-next" type="button">下一步</button>
        <input id="replay-progress" type="range" min="0" value="0" aria-label="回放进度" />
        <span id="replay-position">1 / 1</span>
        <span id="replay-event"></span>
      </div>
      <div class="seat opponent seat-left" id="left-seat"><div class="player"><span class="avatar" id="left-avatar">B</span><span><strong id="left-name">玩家 B</strong><small id="left-count">17 张</small></span></div><div id="left-cards" class="opponent-cards cards-back vertical"></div><div id="left-play" class="played-slot"></div></div>
      <div class="seat opponent seat-right" id="right-seat"><div class="player"><span class="avatar" id="right-avatar">C</span><span><strong id="right-name">玩家 C</strong><small id="right-count">17 张</small></span></div><div id="right-cards" class="opponent-cards cards-back vertical"></div><div id="right-play" class="played-slot"></div></div>
      <div class="seat seat-self"><div class="player"><span class="avatar human" id="self-avatar">A</span><span><strong id="self-name">你的手牌</strong><small id="self-count">17 张</small></span></div><div id="self-play" class="played-slot"></div><footer class="actions"><button id="bid" class="primary">叫地主</button><button id="decline" class="secondary">不叫</button><button id="pass" class="secondary">不要</button><button id="play" class="primary">出牌</button></footer><div id="my-hand" class="hand"></div></div>
      <div class="middle"><div id="game-lifecycle" class="game-lifecycle" hidden><strong id="game-status"></strong><small id="ready-status"></small><button id="start-game" class="primary" type="button"></button></div><div id="countdown" class="countdown turn-timer" aria-live="polite"></div><div class="bottom"><span>底牌</span><div id="bottom-cards" class="bottom-cards"></div></div></div>
      <aside id="decision-panel" class="decision-panel" aria-label="Agent 决策记录" hidden>
        <header><strong>决策记录</strong><button id="close-decisions" type="button" aria-label="关闭决策记录">×</button></header>
        <div id="decision-list" class="decision-list"></div>
      </aside>
      <aside id="review-panel" class="decision-panel" aria-label="Agent 复盘总结" hidden>
        <header><strong>复盘总结</strong><button id="close-reviews" type="button" aria-label="关闭复盘总结">×</button></header>
        <div id="review-list" class="decision-list"></div>
      </aside>
      <aside id="history-panel" class="decision-panel" aria-label="历史对局" hidden>
        <header><strong>历史对局</strong><button id="close-history" type="button" aria-label="关闭历史对局">×</button></header>
        <div id="history-list" class="decision-list"></div>
      </aside>
      <div id="message" class="message" role="status"></div>
    </section>
  </main>
  <script type="module" src="/public/app.js?v=18"></script>
</body>
</html>
