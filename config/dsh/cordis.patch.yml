# DeepSeek Harness (DSH) MCP patch for the AI H5 Game server MCP.
#
# Usage (from this repository root):
#   npm start
#   pnpm dsh web --patch ./config/dsh/cordis.patch.yml
#
# The MCP client connects to the running game server; no repository-local command is spawned.
- insert:
    - id: ai-h5-game
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ai-h5-game
        transport: streamable-http
        url: http://127.0.0.1:3000/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
