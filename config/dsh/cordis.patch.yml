# DeepSeek Harness (DSH) MCP patch for the AI H5 Game.
#
# Usage (from this repository root):
#   npm start
#   pnpm dsh web --patch ./config/dsh/cordis.patch.yml
#
# If DSH is started from a different directory, set AI_H5_GAME_ROOT first:
#   AI_H5_GAME_ROOT=/absolute/path/to/ai-h5-game pnpm dsh web --patch ...
- insert:
    - id: ddz-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ddz
        transport: stdio
        command: node
        args:
          - !!js (process.env.AI_H5_GAME_ROOT ?? process.cwd()) + '/mcp-server.js'
        cwd: !!js process.env.AI_H5_GAME_ROOT ?? process.cwd()
        env:
          DDZ_SERVER_URL: http://127.0.0.1:3000
        toolCallTimeoutMs: 60000
        failOnStartupError: false
