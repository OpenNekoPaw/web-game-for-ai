# DeepSeek Harness (DSH) MCP patch for the Agent Game Arena Dou Dizhu server MCP.
#
# Usage (from this repository root):
#   npm start
#   pnpm dsh web --patch ./config/dsh/cordis.patch.yml
#
# The MCP client connects to the running game server; no repository-local command is spawned.
- insert:
    - id: doudizhu
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: doudizhu
        transport: streamable-http
        url: http://127.0.0.1:3000/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
