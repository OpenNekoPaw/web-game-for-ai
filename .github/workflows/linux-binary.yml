name: Linux Binary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-binary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Check syntax
        run: |
          node --check server.js
          node --check public/app.js
          for file in game/*.js; do node --check "$file"; done
          bash -n scripts/build-binary.sh
          bash -n scripts/test-binary.sh

      - name: Run tests
        run: npm test

      - name: Build binary distribution
        env:
          BINARY_OUTPUT_DIR: ${{ runner.temp }}/ddz-dist
        run: npm run build:binary

      - name: Verify Linux executable
        env:
          BINARY_PATH: ${{ runner.temp }}/ddz-dist/ddz-server
        run: |
          file "$BINARY_PATH"
          file "$BINARY_PATH" | grep -q 'ELF 64-bit'
          test ! -e "${{ runner.temp }}/ddz-dist/server.js"
          test ! -d "${{ runner.temp }}/ddz-dist/game"

      - name: Smoke test binary
        env:
          BINARY_PATH: ${{ runner.temp }}/ddz-dist/ddz-server
        run: scripts/test-binary.sh

      - name: Package artifact
        env:
          DIST_DIR: ${{ runner.temp }}/ddz-dist
          ARTIFACT: agent-game-ddz-linux-${{ matrix.arch }}
        run: |
          tar -C "$DIST_DIR" -czf "$RUNNER_TEMP/$ARTIFACT.tar.gz" ddz-server share
          cd "$RUNNER_TEMP"
          sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-game-ddz-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/agent-game-ddz-linux-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/agent-game-ddz-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
